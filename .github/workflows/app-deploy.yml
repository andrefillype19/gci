name: "2. Application Build & Deploy (k3s)"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'deploy/**'       # Monitora toda a estrutura de manifestos (base, common, overlays)
      - 'nfs-server/**'

jobs:
  build-and-deploy:
    name: "Build Docker Image & Deploy to k3s"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build da aplicação Yii
      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gci:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gci:${{ github.sha }}

      # 2. Build do Servidor NFS
      - name: Build and Push NFS Image
        uses: docker/build-push-action@v5
        with:
          context: ./nfs-server
          file: ./nfs-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gci-file-server:latest

      # 3. Configurar Credenciais AWS
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # 4. Obter o IP Público da EC2 do k3s com validação
      - name: Get EC2 Public IP
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=gci-app-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" == "None" ]; then
            echo "ERRO: Nenhuma instancia 'gci-app-server' em estado running foi encontrada na us-east-2."
            exit 1
          fi

          echo "ec2_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      # 5. SSH na EC2 pública para clonar/sincronizar o repositório e aplicar via Kustomize (-k)
      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Clona ou atualiza a pasta do repositório na EC2
            if [ ! -d "/home/ubuntu/gci" ]; then
              git clone https://github.com/andrefillype19/gci.git /home/ubuntu/gci
            fi
            cd /home/ubuntu/gci
            git pull origin main

            # 2. Garante que o namespace 'app' existe
            sudo /usr/local/bin/k3s kubectl create namespace app --dry-run=client -o yaml | sudo /usr/local/bin/k3s kubectl apply -f -

            # 3. Aplica o Kustomize (-k) apontando para o overlay desejado
            # Altere o caminho abaixo para o overlay que deseja utilizar no ambiente:
            # Opções: deploy/overlays/nfs-round-robin | deploy/overlays/nfs-sticky | deploy/overlays/no-nfs-round-robin | deploy/overlays/no-nfs/sticky
            sudo /usr/local/bin/k3s kubectl apply -k deploy/overlays/nfs-round-robin -n app

            # 4. Força o rollout restart para garantir que os pods baixem a nova imagem latest
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/gci-app -n app

            # 5. Aguarda a conclusão do rollout (timeout de 60s)
            sudo /usr/local/bin/k3s kubectl rollout status deployment/gci-app -n app --timeout=60s