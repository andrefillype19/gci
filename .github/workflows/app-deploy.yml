name: "2. Application Build & Deploy (k3s)"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'deploy/**' # Monitora alterações na pasta deploy (manifestos k8s)
      - 'nfs-server/**'

jobs:
  build-and-deploy:
    name: "Build Docker Image & Deploy to k3s"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build da aplicação Yii
      - name: Build and Push App Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gci:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gci:${{ github.sha }}

      # Build do Servidor NFS (Caso altere o Dockerfile do nfs-server)
      - name: Build and Push NFS Image
        uses: docker/build-push-action@v5
        with:
          context: ./nfs-server
          file: ./nfs-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gci-file-server:latest

      # Obter o IP Público da EC2 do k3s
      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=gci-app-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text)
          echo "ec2_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      # SSH na EC2 pública para sincronizar a pasta 'deploy' e aplicar no k3s
      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.get-ip.outputs.ec2_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Garante que a pasta /home/ubuntu/app existe
            mkdir -p /home/ubuntu/app

            # 2. Baixa o manifesto k8s diretamente do repositório para a instância
            curl -sSL https://raw.githubusercontent.com/andrefillype19/gci/main/k8s/deployment.yaml -o /home/ubuntu/app/deployment.yaml

            # 3. Garante que o namespace 'app' existe
            sudo /usr/local/bin/k3s kubectl create namespace app --dry-run=client -o yaml | sudo /usr/local/bin/k3s kubectl apply -f -

            # 4. Aplica o manifesto (cria se não existir, atualiza se já existir)
            sudo /usr/local/bin/k3s kubectl apply -f /home/ubuntu/app/deployment.yaml -n app

            # 5. Força o rollout restart para garantir que a imagem latest seja puxada do Docker Hub
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/gci-app -n app
            
            # 6. Aguarda o status do rollout
            sudo /usr/local/bin/k3s kubectl rollout status deployment/gci-app -n app --timeout=60s