apiVersion: apps/v1
kind: Deployment
metadata:
  name: gci-app
  namespace: app
  labels:
    app.kubernetes.io/name: gci-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gci-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gci-app
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gci-app
          image: andrefillype98/gci:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 250m
              memory: 180Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - secretRef:
                name: app-database-credentials
          volumeMounts:
            - name: php-overrides
              mountPath: /usr/local/etc/php/conf.d/zzz-gci-warnings.ini
              subPath: zzz-gci-warnings.ini
              readOnly: true
      volumes:
        - name: php-overrides
          configMap:
            name: gci-php-overrides