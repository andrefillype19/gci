# PersistentVolumes NFSv4.1 apontando para o mount target do EFS (terraform/efs.tf).
# O IP deve coincidir com var.efs_private_ip (padrao 10.0.2.70).
# Requer o pacote nfs-common no no do k3s (instalado pelo workflow 2).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gci-efs-uploads-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, rsize=1048576, wsize=1048576, hard, timeo=600, retrans=2, noresvport, noatime]
  nfs:
    server: 10.0.2.70
    path: /uploads
  claimRef:
    namespace: app
    name: nfs-uploads-pvc
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gci-efs-sessions-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: [nfsvers=4.1, rsize=1048576, wsize=1048576, hard, timeo=600, retrans=2, noresvport, noatime]
  nfs:
    server: 10.0.2.70
    path: /sessions
  claimRef:
    namespace: app
    name: nfs-sessions-pvc
