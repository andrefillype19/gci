apiVersion: apps/v1
kind: Deployment
metadata:
  name: gci-file-server
  namespace: app
  labels:
    app.kubernetes.io/name: gci-file-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gci-file-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gci-file-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nfs-server
          image: andrefillype98/gci-nfs-server:latest
          imagePullPolicy: Always
          ports:
            - name: rpcbind
              containerPort: 111
              protocol: TCP
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: mountd
              containerPort: 20048
              protocol: TCP
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads-data
              mountPath: /export/uploads
            - name: sessions-data
              mountPath: /export/sessions
      volumes:
        - name: uploads-data
          hostPath:
            path: /var/gci-storage/uploads
            type: DirectoryOrCreate
        - name: sessions-data
          hostPath:
            path: /var/gci-storage/sessions
            type: DirectoryOrCreate